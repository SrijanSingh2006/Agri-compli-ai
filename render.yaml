# AgriComply - Render Blueprint
# Deploy: Connect repo at render.com, use "New Blueprint" and select this file
# After first deploy: Set NODE_API_URL in Flask service to your Node service URL

services:
  # Node backend: Auth, Vault, Growth, Compliance (MySQL required)
  - type: web
    name: agricomply-node
    runtime: node
    region: oregon
    rootDir: AgriComply-AI-main/server
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: agricomply_db
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Flask: Frontend + Chat + AI + API proxy (main entry point)
  - type: web
    name: agricomply-web
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_API_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
